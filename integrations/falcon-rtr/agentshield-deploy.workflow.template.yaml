# Falcon Fusion RTR workflow template for Windows.
# Upload the custom scripts, replace all placeholders, and set the reviewed
# package SHA-256 in AgentShield-Apply-Windows before importing this file.

name: '[Windows] AgentShield deployment - RTR'
trigger:
  name: On demand
  type: On demand
  next: [SelectPilotEndpoints]
actions:
  SelectPilotEndpoints:
    id: 68ffa99af40c84b36462daa076f535d0
    default_name: Device Query
    name: Select pilot endpoints
    properties:
      device_status: normal
      group: <FALCON_HOST_GROUP_ID>
    version_constraint: ~1
    next: [ForEachSensorIDsConcurrently]
loops:
  ForEachSensorIDsConcurrently:
    name: Apply on each selected Windows sensor concurrently
    display: Apply on each selected Windows sensor concurrently
    for:
      input: SelectPilotEndpoints.devices
      continue_on_partial_execution: true
      sequential: false
    trigger:
      next: [GetDeviceDetails]
    actions:
      GetDeviceDetails:
        id: 6265dc947cc2252f74a5f25261ac36a9
        default_name: Get device details
        name: Get device details
        properties:
          device_id: ${SelectPilotEndpoints.devices.#}
        version_constraint: ~1
        next: [platform_is_windows]
      CleanAgentShieldStaging:
        id: <AGENTSHIELD_CLEANUP_WINDOWS_ACTIVITY_ID>
        default_name: AgentShield-Cleanup-Windows
        name: Clean AgentShield staging
        properties:
          device_id: ${SelectPilotEndpoints.devices.#}
          csfusion_rtr_timeout: 120
        version_constraint: ~0
        next: [PutAgentShieldPackage]
      PutAgentShieldPackage:
        id: 1f4e86048c1e676a59f60e961a8c0c15
        default_name: Put file
        name: Put AgentShield package
        properties:
          device_id: ${SelectPilotEndpoints.devices.#}
          file_name: agent-shield.zip
          file_path: C:\Windows\Temp
          queue_offline: false
        version_constraint: ~1
        next: [ApplyAgentShieldConfiguration]
      ApplyAgentShieldConfiguration:
        id: <AGENTSHIELD_APPLY_WINDOWS_ACTIVITY_ID>
        default_name: AgentShield-Apply-Windows
        name: Apply AgentShield configuration
        properties:
          device_id: ${SelectPilotEndpoints.devices.#}
          csfusion_rtr_timeout: 600
        version_constraint: ~0
        next: [RecordAgentShieldResult]
      RecordAgentShieldResult:
        id: 04c59ceb6dff9e6cd89e5f5cf13121ab
        default_name: Write to log repo
        name: Record AgentShield result
        properties:
          custom_json:
            agentshield:
              event: apply_result
              workflow: ${Workflow.Definition.Name}
              host_aid: ${SelectPilotEndpoints.devices.#}
              host_platform: ${GetDeviceDetails.Platform}
              outcome: ${ApplyAgentShieldConfiguration.outcome}
              package_sha256: ${ApplyAgentShieldConfiguration.package_sha256}
              extract_ok: ${ApplyAgentShieldConfiguration.extract_ok}
              precheck_compliant: ${ApplyAgentShieldConfiguration.precheck_compliant}
              precheck_exit_code: ${ApplyAgentShieldConfiguration.precheck_exit_code}
              deploy_ran: ${ApplyAgentShieldConfiguration.deploy_ran}
              deploy_status: ${ApplyAgentShieldConfiguration.deploy_status}
              deploy_exit_code: ${ApplyAgentShieldConfiguration.deploy_exit_code}
              validate_compliant: ${ApplyAgentShieldConfiguration.validate_compliant}
              validate_exit_code: ${ApplyAgentShieldConfiguration.validate_exit_code}
              cleanup_ok: ${ApplyAgentShieldConfiguration.cleanup_ok}
              error: ${ApplyAgentShieldConfiguration.error}
        version_constraint: ~1
    conditions:
      platform_is_windows:
        display: [Platform is Windows]
        expression: GetDeviceDetails.Platform:'Windows'
        next: [CleanAgentShieldStaging]
