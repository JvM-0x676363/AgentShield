# security-team-block -- source for the Unix Codex CLI managed_config.toml
# Referenced by targets/codex-managed.json on Linux and macOS.
#
# Current Windows clients ignore ~/.codex/managed_config.toml. Windows defaults
# are intentionally left to the user-facing Settings UI or config.toml; the
# endpoint package continues to enforce requirements.toml without overwriting
# developer-owned configuration.
#
# These are defaults, not enforcement. Users may change them during a session;
# requirements.toml controls non-overridable restrictions.
#
# Codex 0.172 rejects [rules] in managed_config.toml. Command restrictions
# belong exclusively in requirements.toml; workflow approvals stay user- or
# session-controlled through approval_policy and optional Auto-review.

approval_policy = "on-request"
web_search = "cached"

[sandbox_workspace_write]
# This egress control is enforced by the OS sandbox rather than command-name
# matching, so it applies to all binaries.
network_access = false
